# 代码质量检查
lint:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - ruff check src tests
    - mypy src
    - black --check src tests
  only:
    - merge_requests
    - main
    - master
    - develop

# 构建阶段
build:
  stage: build
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - python -m build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - tags
    - main
    - master

# 部署阶段 - 发布到 PyPI 私库
deploy:pypi:
  stage: deploy
  image: python:3.11
  dependencies:
    - build
  before_script:
    - python -m pip install --upgrade pip
    - pip install twine
  script:
    - |
      if [ -n "$PYPI_REPOSITORY_URL" ]; then
        twine upload --repository-url "$PYPI_REPOSITORY_URL" \
          --username "$PYPI_USERNAME" \
          --password "$PYPI_PASSWORD" \
          dist/*
      else
        echo "PYPI_REPOSITORY_URL 未设置，跳过发布"
      fi
  only:
    - tags
  when: manual
  environment:
    name: pypi
    url: $PYPI_REPOSITORY_URL

