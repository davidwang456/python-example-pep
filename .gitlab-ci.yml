stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

# 测试阶段
test:python3.8:
  stage: test
  image: python:3.8
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

