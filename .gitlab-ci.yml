stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Note: PIP_CONFIG_FILE should be defined as a File type variable in GitLab CI/CD settings
  # GitLab will create a temporary file and set PIP_CONFIG_FILE to its path
  # If not set, pip will use default configuration

cache:
  paths:
    - .cache/pip
    - venv/

# Shared script to setup pip configuration from GitLab CI/CD file variable
.pip_config_setup: &pip_config_setup
  - |
    # Copy pip config from GitLab CI/CD file type variable to project root
    # When PIP_CONFIG_FILE is defined as a File type variable in GitLab CI/CD,
    # GitLab creates a temporary file and sets PIP_CONFIG_FILE environment variable to its path
    if [ -n "$PIP_CONFIG_FILE" ] && [ -f "$PIP_CONFIG_FILE" ]; then
      # Save the original path for logging
      ORIGINAL_CONFIG="$PIP_CONFIG_FILE"
      # Copy the config file to project root
      cp "$PIP_CONFIG_FILE" "$CI_PROJECT_DIR/pip.conf"
      # Set PIP_CONFIG_FILE to point to the copied file in project root
      export PIP_CONFIG_FILE="$CI_PROJECT_DIR/pip.conf"
      echo "✓ Using pip configuration from GitLab CI/CD file variable"
      echo "  Original file: $ORIGINAL_CONFIG"
      echo "  Copied to: $CI_PROJECT_DIR/pip.conf"
      echo "  PIP_CONFIG_FILE is now set to: $PIP_CONFIG_FILE"
    else
      echo "ℹ PIP_CONFIG_FILE not set or file not found, using default pip configuration"
      echo "  To use custom pip config, set PIP_CONFIG_FILE as a File type variable in GitLab CI/CD settings"
    fi
  - python -m pip install --upgrade pip

# Test stage
test:python3.8:
  stage: test
  image: python:3.8
  before_script:
    - *pip_config_setup
    - pip install -e ".[dev]"
  script:
    - pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

