# Code quality check
lint:
  stage: test
  image: python:3.11
  before_script:
    - *pip_config_setup
    - pip install -e ".[dev]"
  script:
    - ruff check src tests
    - mypy src
    - black --check src tests
  only:
    - merge_requests
    - main
    - master
    - develop

# Build stage
build:
  stage: build
  image: python:3.11
  before_script:
    - *pip_config_setup
    - pip install build
  script:
    - python -m build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - tags
    - main
    - master

# Deploy stage - Publish to private PyPI
deploy:pypi:
  stage: deploy
  image: python:3.11
  dependencies:
    - build
  before_script:
    - *pip_config_setup
    - pip install twine
  script:
    - |
      if [ -n "$PYPI_REPOSITORY_URL" ]; then
        twine upload --repository-url "$PYPI_REPOSITORY_URL" \
          --username "$PYPI_USERNAME" \
          --password "$PYPI_PASSWORD" \
          dist/*
      else
        echo "PYPI_REPOSITORY_URL not set, skipping publish"
      fi
  only:
    - tags
  when: manual
  environment:
    name: pypi
    url: $PYPI_REPOSITORY_URL

