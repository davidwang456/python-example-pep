stages:
  - test
  - build
  - package
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.11

cache:
  paths:
    - .cache/pip

# -----------------------------------------------------------------------------
# test — 静态检查与单元测试（Python 3.11）
# -----------------------------------------------------------------------------
lint:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - ruff check src tests
    - mypy src
    - black --check src tests

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week

# -----------------------------------------------------------------------------
# build — PEP 517 构建 sdist / wheel
# -----------------------------------------------------------------------------
build:
  stage: build
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - python -m build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# -----------------------------------------------------------------------------
# package — 校验分发包并可从 wheel 安装冒烟
# -----------------------------------------------------------------------------
package:
  stage: package
  needs:
    - job: build
      artifacts: true
  before_script:
    - python -m pip install --upgrade pip
    - pip install twine
  script:
    - twine check dist/*
    - pip install dist/*.whl
    - python -c "import example_pep; print('import ok', example_pep.__version__)"

# -----------------------------------------------------------------------------
# deploy — 发布到私有 PyPI（打 tag 后手动触发）
# -----------------------------------------------------------------------------
deploy:pypi:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: package
  before_script:
    - python -m pip install --upgrade pip
    - pip install twine
  script:
    - |
      if [ -n "$PYPI_REPOSITORY_URL" ]; then
        twine upload --repository-url "$PYPI_REPOSITORY_URL" \
          --username "$PYPI_USERNAME" \
          --password "$PYPI_PASSWORD" \
          dist/*
      else
        echo "PYPI_REPOSITORY_URL not set, skipping publish"
      fi
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  environment:
    name: pypi
    url: $PYPI_REPOSITORY_URL
